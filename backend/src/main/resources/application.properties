# ===================================
# SharpShadow Backend Configuration
# ===================================

# Server
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=sharpshadow

# ===================================
# MySQL Database
# ===================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/sharpshadow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=${JWT_SECRET:SharpShadowSuperSecretKeyForJWTSigningMustBe256BitsLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================
# Firebase Configuration
# ===================================
# Production (Railway): set FIREBASE_SERVICE_ACCOUNT_B64 to a Base64-encoded service account JSON
app.firebase.credentials-base64=${FIREBASE_SERVICE_ACCOUNT_B64:}
# Local dev fallback: path to the JSON file on disk (ignored by .gitignore)
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
app.firebase.bucket-name=${FIREBASE_STORAGE_BUCKET:sharpshadow-d6d6b.firebasestorage.app}
app.firebase.presigned-url-duration-minutes=${S3_PRESIGNED_URL_DURATION:15}

# ===================================
# Razorpay Configuration
# ===================================
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_SsWVUQNtSSWKbm}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:xm5m4wDQTq6N9UPQ7e485HWO}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

# ===================================
# CORS Configuration
# ===================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173, https://project-sharpshadow.vercel.app}

# ===================================
# File Upload Configuration
# ===================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===================================
# Logging
# ===================================
logging.level.com.sharpshadow=INFO
logging.level.org.springframework.security=WARN
