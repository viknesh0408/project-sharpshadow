# ===================================
# SharpShadow Backend Configuration
# ===================================

# Server
server.port=${PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=sharpshadow

# ===================================
# MySQL Database
# ===================================
# Railway MySQL plugin injects: MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sharpshadow}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# -1 means log the error but don't crash the app if DB is unreachable at startup
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Defer datasource init so app doesn't crash if DB takes a moment to be ready
spring.jpa.defer-datasource-initialization=true

# ===================================
# JWT Configuration
# ===================================
app.jwt.secret=${JWT_SECRET:SharpShadowSuperSecretKeyForJWTSigningMustBe256BitsLong!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================
# Firebase Configuration
# ===================================
# Production (Railway): set FIREBASE_SERVICE_ACCOUNT_B64 to a Base64-encoded service account JSON
app.firebase.credentials-base64=${FIREBASE_SERVICE_ACCOUNT_B64:}
# Local dev fallback: path to the JSON file on disk (ignored by .gitignore)
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}
app.firebase.bucket-name=${FIREBASE_STORAGE_BUCKET:sharpshadow-d6d6b.firebasestorage.app}
app.firebase.presigned-url-duration-minutes=${S3_PRESIGNED_URL_DURATION:15}

# ===================================
# Razorpay Configuration
# ===================================
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_SsWVUQNtSSWKbm}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:xm5m4wDQTq6N9UPQ7e485HWO}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

# ===================================
# CORS Configuration
# ===================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS: https://project-sharpshadow.vercel.app , http://localhost:5173}

# ===================================
# File Upload Configuration
# ===================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===================================
# Logging
# ===================================
logging.level.com.sharpshadow=INFO
logging.level.org.springframework.security=WARN

# ===================================
# Actuator (Railway health check)
# ===================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
