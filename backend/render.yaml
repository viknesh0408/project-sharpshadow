services:
  - type: web
    name: sharpshadow-backend
    env: java
    region: singapore
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/sharpshadow-backend-1.0.0.jar
    envVars:
      - key: MYSQL_URL
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_PATH
        value: firebase-service-account.json
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://sharpshadow.vercel.app
